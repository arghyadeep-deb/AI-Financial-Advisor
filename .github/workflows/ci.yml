name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: advisor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci-only-password@localhost:5432/advisor_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend_requirements.txt
            frontend/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (mocked providers, isolated databases)
        run: python -m pytest tests -q --timeout=180
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r backend_requirements.txt -r frontend/requirements.txt
      - name: Secret scan (tracked files)
        run: |
          if git grep -nE "(sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|lsv2_[A-Za-z0-9_]{20,}|-----BEGIN (RSA |EC )?PRIVATE KEY-----)" -- . ':!.github'; then
            echo "possible secret committed"; exit 1; fi
